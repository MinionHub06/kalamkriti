<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - KalamKriti</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cream': '#F7F3E9',
                        'linen': '#F5F1E8',
                        'cocoa': '#3C2415',
                        'maroon': '#8B1538',
                        'emerald': '#2D5016',
                        'gold': '#B8860B'
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="handloom.css">
</head>
<body class="bg-cream font-sans">
    <!-- Header will be rendered by header-component.js -->

    <!-- Hero Section -->
    <section class="pt-24 pb-16 bg-gradient-to-br from-emerald/10 to-maroon/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-serif font-bold text-cocoa mb-6">
                    Our Handloom Collection
                </h1>
                <p class="text-xl text-cocoa/70 max-w-3xl mx-auto">
                    Discover our curated collection of authentic handloom products, each piece telling a story of tradition and craftsmanship.
                </p>
            </div>
        </div>
    </section>

    <!-- Filters -->
    <section class="py-8 bg-white border-b border-cocoa/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap gap-4 justify-center">
                <button class="filter-btn bg-maroon text-white" data-category="all">All Products</button>
                <button class="filter-btn bg-white text-cocoa border border-cocoa/20" data-category="sarees">Sarees</button>
                <button class="filter-btn bg-white text-cocoa border border-cocoa/20" data-category="kurtas">Kurtas</button>
                <button class="filter-btn bg-white text-cocoa border border-cocoa/20" data-category="dupattas">Dupattas</button>
                <button class="filter-btn bg-white text-cocoa border border-cocoa/20" data-category="shawls">Shawls</button>
            </div>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8" id="products-grid">
                <!-- Products will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden">
                <!-- Modal Header -->
                <div class="flex items-center justify-between p-6 border-b border-cocoa/10">
                    <h2 class="text-2xl font-serif font-bold text-cocoa">Shopping Cart</h2>
                    <button onclick="toggleCartModal()" class="text-cocoa/50 hover:text-maroon transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="p-6 overflow-y-auto max-h-[60vh]">
                    <div id="cart-modal-items" class="space-y-4">
                        <!-- Cart items will be loaded here -->
                    </div>
                    
                    <!-- Empty Cart State -->
                    <div id="cart-modal-empty" class="text-center py-8 hidden">
                        <svg class="w-16 h-16 text-cocoa/30 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.5 5M7 13l2.5 5m6-5v6a2 2 0 01-2 2H9a2 2 0 01-2-2v-6m8 0V9a2 2 0 00-2-2H9a2 2 0 00-2 2v4.01"/>
                        </svg>
                        <h3 class="text-lg font-serif font-bold text-cocoa mb-2">Your cart is empty</h3>
                        <p class="text-cocoa/70 mb-4">Add some beautiful handloom pieces to get started</p>
                        <button onclick="toggleCartModal()" class="bg-maroon hover:bg-maroon/90 text-white px-6 py-2 rounded-lg font-semibold transition-colors">
                            Continue Shopping
                        </button>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div id="cart-modal-footer" class="p-6 border-t border-cocoa/10 bg-linen hidden">
                    <div class="space-y-4">
                        <!-- Order Summary -->
                        <div class="space-y-2">
                            <div class="flex justify-between">
                                <span class="text-cocoa/70">Subtotal</span>
                                <span class="font-semibold text-cocoa" id="cart-modal-subtotal">₹0</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-cocoa/70">Shipping</span>
                                <span class="font-semibold text-cocoa" id="cart-modal-shipping">₹200</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-cocoa/70">Tax</span>
                                <span class="font-semibold text-cocoa" id="cart-modal-tax">₹0</span>
                            </div>
                            <div class="border-t border-cocoa/20 pt-2">
                                <div class="flex justify-between">
                                    <span class="text-lg font-bold text-cocoa">Total</span>
                                    <span class="text-lg font-bold text-maroon" id="cart-modal-total">₹200</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="flex space-x-3">
                            <button onclick="toggleCartModal()" class="flex-1 bg-white text-cocoa border border-cocoa/20 hover:bg-cream py-3 rounded-lg font-semibold transition-colors">
                                Continue Shopping
                            </button>
                            <button onclick="proceedToCheckout()" class="flex-1 bg-maroon hover:bg-maroon/90 text-white py-3 rounded-lg font-semibold transition-colors">
                                Checkout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="header-component.js"></script>
    <script src="cart-enhanced.js"></script>
    <script src="products.js"></script>
    <script src="handloom.js"></script>
</body>
</html>
