<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KalamKriti</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cream': '#F7F3E9',
                        'linen': '#F5F1E8',
                        'cocoa': '#3C2415',
                        'maroon': '#8B1538',
                        'emerald': '#2D5016',
                        'gold': '#B8860B'
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="handloom.css">
</head>
<body class="bg-cream font-sans">
    <header class="bg-cream/95 backdrop-blur-sm fixed w-full top-0 z-50 border-b border-cocoa/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <a href="handloom.html" class="text-2xl font-serif font-bold text-cocoa">KalamKriti</a>
                </div>
                <nav class="hidden md:flex space-x-8">
                    <a href="products.html" class="text-cocoa hover:text-maroon transition-colors font-medium">Products</a>
                    <a href="weavers.html" class="text-cocoa hover:text-maroon transition-colors font-medium">Our Weavers</a>
                    <a href="handloom.html#story" class="text-cocoa hover:text-maroon transition-colors font-medium">Our Story</a>
                    <a href="dashboard.html" class="text-maroon font-medium">Dashboard</a>
                </nav>
                <div class="flex items-center space-x-4">
                    <span id="user-name" class="text-cocoa font-medium">Welcome, User</span>
                    <button onclick="logout()" class="text-cocoa hover:text-maroon transition-colors font-medium">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Dashboard Content -->
    <div class="pt-24 pb-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid lg:grid-cols-4 gap-8">
                <!-- Sidebar -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h3 class="text-lg font-serif font-bold text-cocoa mb-4">Dashboard</h3>
                        <nav class="space-y-2">
                            <a href="#profile" class="block px-4 py-2 text-cocoa hover:bg-cream rounded-lg transition-colors">Profile</a>
                            <a href="#orders" class="block px-4 py-2 text-cocoa hover:bg-cream rounded-lg transition-colors">My Orders</a>
                            <a href="#wishlist" class="block px-4 py-2 text-cocoa hover:bg-cream rounded-lg transition-colors">Wishlist</a>
                            <a href="#weaver-profile" class="block px-4 py-2 text-cocoa hover:bg-cream rounded-lg transition-colors">Weaver Profile</a>
                            <a href="#settings" class="block px-4 py-2 text-cocoa hover:bg-cream rounded-lg transition-colors">Settings</a>
                        </nav>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="lg:col-span-3">
                    <!-- Profile Section -->
                    <div id="profile-section" class="bg-white rounded-xl shadow-lg p-8 mb-8">
                        <h2 class="text-2xl font-serif font-bold text-cocoa mb-6">Profile Information</h2>
                        <form id="profile-form" class="space-y-6">
                            <div class="grid md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-cocoa mb-2">First Name</label>
                                    <input type="text" id="firstName" class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-cocoa mb-2">Last Name</label>
                                    <input type="text" id="lastName" class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-cocoa mb-2">Email</label>
                                <input type="email" id="email" class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-cocoa mb-2">Phone</label>
                                <input type="tel" id="phone" class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors">
                            </div>
                            <button type="submit" class="bg-maroon hover:bg-maroon/90 text-white px-6 py-3 rounded-lg font-semibold transition-colors">
                                Update Profile
                            </button>
                        </form>
                    </div>

                    <!-- Orders Section -->
                    <div id="orders-section" class="bg-white rounded-xl shadow-lg p-8 mb-8 hidden">
                        <h2 class="text-2xl font-serif font-bold text-cocoa mb-6">My Orders</h2>
                        <div class="space-y-4">
                            <div class="border border-cocoa/20 rounded-lg p-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-semibold text-cocoa">Heritage Silk Saree</h3>
                                        <p class="text-cocoa/70 text-sm">Order #KK001</p>
                                        <p class="text-cocoa/70 text-sm">Placed on: 15 Dec 2024</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="font-bold text-maroon">₹18,500</p>
                                        <span class="inline-block px-3 py-1 bg-emerald/10 text-emerald text-sm rounded-full">Delivered</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Weaver Profile Section -->
                    <div id="weaver-profile-section" class="bg-white rounded-xl shadow-lg p-8 mb-8 hidden">
                        <h2 class="text-2xl font-serif font-bold text-cocoa mb-6">Weaver Profile</h2>
                        <form id="weaver-form" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-cocoa mb-2">Specialization</label>
                                <select class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors">
                                    <option>Silk Weaving</option>
                                    <option>Cotton Weaving</option>
                                    <option>Zari Work</option>
                                    <option>Block Printing</option>
                                    <option>Pashmina Weaving</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-cocoa mb-2">Experience (Years)</label>
                                <input type="number" class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-cocoa mb-2">Bio</label>
                                <textarea rows="4" class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors"></textarea>
                            </div>
                            <button type="submit" class="bg-emerald hover:bg-emerald/90 text-white px-6 py-3 rounded-lg font-semibold transition-colors">
                                Update Weaver Profile
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="handloom.js"></script>
</body>
</html>
