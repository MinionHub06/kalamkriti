<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KalamKriti</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cream': '#F7F3E9',
                        'linen': '#F5F1E8',
                        'cocoa': '#3C2415',
                        'maroon': '#8B1538',
                        'emerald': '#2D5016',
                        'gold': '#B8860B'
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="handloom.css">
</head>
<body class="bg-cream font-sans min-h-screen flex items-center justify-center">
    <!-- Background Pattern -->
    <div class="absolute inset-0 bg-gradient-to-br from-emerald/20 to-maroon/30">
        <svg class="absolute inset-0 w-full h-full object-cover" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <pattern id="loomPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                    <rect width="40" height="40" fill="#8B1538" opacity="0.1"/>
                    <path d="M0 20h40M20 0v40" stroke="#2D5016" stroke-width="0.5" opacity="0.3"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#loomPattern)"/>
        </svg>
    </div>

    <div class="relative z-10 w-full max-w-md mx-auto px-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-serif font-bold text-cocoa mb-2">KalamKriti</h1>
            <p class="text-cocoa/70">Weaving a Future</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white rounded-xl shadow-2xl p-8">
            <h2 class="text-2xl font-serif font-bold text-cocoa mb-6 text-center">Welcome Back</h2>
            
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-cocoa mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required 
                           class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors"
                           placeholder="Enter your email">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-cocoa mb-2">Password</label>
                    <input type="password" id="password" name="password" required 
                           class="w-full px-4 py-3 border border-cocoa/20 rounded-lg focus:ring-2 focus:ring-maroon focus:border-transparent transition-colors"
                           placeholder="Enter your password">
                </div>
                
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded border-cocoa/20 text-maroon focus:ring-maroon">
                        <span class="ml-2 text-sm text-cocoa/70">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-maroon hover:text-maroon/80 transition-colors">Forgot password?</a>
                </div>
                
                <button type="submit" class="w-full bg-maroon hover:bg-maroon/90 text-white py-3 rounded-lg font-semibold transition-colors">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-cocoa/70">Don't have an account? 
                    <a href="register.html" class="text-maroon hover:text-maroon/80 font-semibold transition-colors">Sign up</a>
                </p>
            </div>
            
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-cocoa/20"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-cocoa/70">Or continue with</span>
                    </div>
                </div>
                
                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button class="w-full inline-flex justify-center py-2 px-4 border border-cocoa/20 rounded-lg shadow-sm bg-white text-sm font-medium text-cocoa hover:bg-cream transition-colors">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="ml-2">Google</span>
                    </button>
                    
                    <button class="w-full inline-flex justify-center py-2 px-4 border border-cocoa/20 rounded-lg shadow-sm bg-white text-sm font-medium text-cocoa hover:bg-cream transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        <span class="ml-2">Facebook</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a href="handloom.html" class="text-cocoa/70 hover:text-cocoa transition-colors">
                ← Back to Home
            </a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
